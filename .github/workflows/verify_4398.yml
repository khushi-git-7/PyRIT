name: verify 4398
on: pull_request
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.11" }
      - run: uv sync --frozen --extra all
      - name: new tests
        run: uv run --frozen pytest tests/unit/converter/test_image_blur_converter.py -v -p no:randomly
      - name: converter unit tests
        run: uv run --frozen pytest -n 4 tests/unit/converter -q
      - name: "mutation: plain RGBA blur (transparent-colour test expected to FAIL)"
        run: |
          sed -i 's/return image.convert("RGBa").filter(blur).convert("RGBA")/return image.filter(blur)/' pyrit/converter/image_blur_converter.py
          git diff --stat
          if uv run --frozen pytest tests/unit/converter/test_image_blur_converter.py -q -k transparent_colors; then echo NOT CAUGHT; exit 1; fi
          git checkout -- pyrit
      - name: "mutation: blur ignores radius (gradient tests expected to FAIL)"
        run: |
          sed -i 's/ImageFilter.GaussianBlur(self._radius)/ImageFilter.GaussianBlur(2.0)/' pyrit/converter/image_blur_converter.py
          if uv run --frozen pytest tests/unit/converter/test_image_blur_converter.py -q -k larger_radius; then echo NOT CAUGHT; exit 1; fi
          git checkout -- pyrit
      - name: generate notebook cells
        run: uv run --frozen --with jupytext --with nbclient --with ipykernel --with nbformat python .verify/gen_nb.py ImageBlurConverter ImageResizingConverter
      - name: pre-commit on changed files (twice, so fixers settle)
        run: |
          FILES="pyrit/converter/image_blur_converter.py pyrit/converter/__init__.py tests/unit/converter/test_image_blur_converter.py doc/code/converters/3_image_converters.py doc/code/converters/3_image_converters.ipynb doc/code/converters/0_converters.ipynb"
          uv run --frozen --with pre-commit pre-commit run --files $FILES || true
          git diff --stat
          uv run --frozen --with pre-commit pre-commit run --files $FILES
      - name: ty
        run: make ty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebooks
          path: |
            doc/code/converters/3_image_converters.ipynb
            doc/code/converters/0_converters.ipynb
